{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NCWSCwaterLAB">
    <title>Login | Nairobi City Water & Sewerage</title>
    <link rel="manifest" href="/manifest.json?v=20261020-enterprise-theme">
    <meta name="theme-color" content="#417690">
    <script src="{% static 'core/js/theme.js' %}?v=20261020-enterprise-theme"></script>
    <script>document.documentElement.classList.remove('fullscreen-app');</script>


    <link rel="stylesheet" href="{% static 'css/font_awesome/all.min.css' %}">


    {% if company.logo %}
    <link rel="apple-touch-icon" href="{{ company.logo.url }}">
    <link rel="icon" href="{{ company.logo.url }}">
    {% elif company.favicon %}
    <link rel="apple-touch-icon" href="{{ company.favicon.url }}">
    <link rel="icon" href="{{ company.favicon.url }}" type="image/png">
    {% else %}
    <link rel="apple-touch-icon" href="{% static 'image/apple-touch-icon.png' %}">
    <link rel="icon" href="{% static 'image/logo.ico' %}" type="image/x-icon">
    {% endif %}

    <link rel="stylesheet" href="{% static 'core/css/theme.css' %}?v=20261020-enterprise-theme">

    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}?v=20261030-auth-feedback-v3">
</head>
<body>


<div id="loginWrapper" class="login-wrapper">


    <div class="login-container">


        <div id="companyBrandingWrapper" data-logo="{% if company.logo %}{{ company.logo.url }}{% else %}{% static 'accounts/images/ncwsc_logo.png' %}{% endif %}">
            {% include 'accounts/components/company_branding.html' %}
        </div>

        <div id="errorMessage"
             class="error-message{% if error %} is-{{ feedback_level|default:'error' }}{% endif %}"
             role="{% if error and feedback_level == 'info' %}status{% else %}alert{% endif %}"
             aria-live="{% if error and feedback_level == 'info' %}polite{% else %}assertive{% endif %}"
             aria-atomic="true"
             {% if not error %}hidden{% endif %}>
            <i id="feedbackIcon"
               class="fas {% if feedback_level == 'warning' %}fa-triangle-exclamation{% elif feedback_level == 'info' %}fa-circle-info{% else %}fa-circle-exclamation{% endif %} feedback-icon"
               aria-hidden="true"></i>
            <span id="feedbackText">{% if error %}{{ error }}{% endif %}</span>
            <button type="button" id="dismissFeedback" class="feedback-dismiss" aria-label="Dismiss message">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
        </div>


        <form id="loginForm"
              method="post"
              action="{% url 'accounts:login' %}"
              autocomplete="off"
              style="width:100%; display:flex; flex-direction:column; gap:8px; margin-top:10px;">

            {% csrf_token %}


            <div class="form-group" id="usernameGroup">
                <i class="fas fa-user left-icon" aria-hidden="true"></i>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Username"
                       autocomplete="off"
                       spellcheck="false"
                       autocapitalize="characters"
                       data-1p-ignore="true"
                       data-lpignore="true"
                       aria-label="Username">
            </div>


            <div class="form-group password-container" id="passwordGroup">
                <i class="fas fa-lock left-icon" aria-hidden="true"></i>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       autocomplete="off"
                       data-1p-ignore="true"
                       data-lpignore="true"
                       aria-label="Password">

                <button type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                        aria-pressed="false">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p id="passwordCapsWarning" class="auth-hint caps-warning" hidden>
                <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
                Caps Lock is on.
            </p>

            <button type="submit"
                    id="loginBtn">
                Login
            </button>
        </form>


        <div class="forgot-password" id="forgotDiv">
            <a href="#" id="forgotPasswordLink"
               data-url="{% url 'accounts:reset_password_request' %}">
                Forgot your password?
            </a>
        </div>

        <div id="resetMessage" class="reset-status" hidden></div>
        <div class="login-network-status" aria-live="polite" role="status" hidden>
            <span id="networkIndicator" class="network-indicator" aria-hidden="true"></span>
            <span id="networkStatus"></span>
        </div>

    </div>
</div>


<script src="{% static 'accounts/js/login.js' %}?v=20261030-auth-feedback-v3"></script>

<script src="{% static 'core/js/pwa.js' %}?v=20261027-no-auto-logout" defer></script>
</body>
</html>
