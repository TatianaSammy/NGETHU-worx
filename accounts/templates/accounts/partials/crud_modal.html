<!-- Universal Record Form Modal -->
<div class="modal fade" id="universalFormModal" tabindex="-1" aria-labelledby="universalFormModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header bg-white border-bottom py-3">
                <h5 class="modal-title fw-bold" id="universalFormModalTitle">
                    <i class="fa fa-pen-to-square text-primary me-2"></i>
                    <span>Manage Record</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

            <div class="modal-body p-4" id="universalFormModalBody">

                    <div class="spinner-border text-primary" role="status">

                </div>
            </div>
        </div>
