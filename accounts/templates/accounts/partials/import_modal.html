<!-- Unified Import Modal -->
<div class="modal fade" id="universalImportModal" tabindex="-1" aria-labelledby="universalImportModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header bg-primary text-white py-3">
                <h5 class="modal-title fw-bold" id="universalImportModalTitle">
                    <i class="fa fa-file-import me-2"></i>
                    <span id="importModalResourceName">Import Data</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="universalImportForm" method="post" enctype="multipart/form-data" action="{% url 'accounts:list_import' 'users' %}">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <p class="text-muted small mb-3">
                        Upload a <strong>CSV</strong> or <strong>Excel (.xlsx)</strong> file to bulk create or update records.
                    </p>

                    <div class="mb-3">
                        <label for="importFileInput" class="form-label fw-bold">Select File</label>
                        <input type="file" name="file" id="importFileInput" class="form-control" accept=".csv,.xlsx,.xls" required>
                        <div class="form-text small text-muted">
                            Supported formats: .csv, .xlsx, .xls
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded-3 mt-3">
                        <div>
                            <span class="fw-semibold small d-block">Need a template?</span>
                            <small class="text-muted">Download sample format for easy preparation.</small>
                        </div>
                        <a id="importSampleDownloadBtn" href="{% url 'accounts:sample_download' 'users' %}" class="btn btn-sm btn-outline-primary rounded-pill">
                            <i class="fa fa-download me-1"></i> Sample CSV
                        </a>
                    </div>

                    <div id="importFeedback" class="alert d-none mt-3 mb-0" role="alert"></div>
                </div>
                <div class="modal-footer bg-light border-top py-3">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="importSubmitBtn" class="btn btn-primary rounded-pill px-4">
                        <i class="fa fa-upload me-1"></i> Start Import
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
