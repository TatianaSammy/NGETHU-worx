<form method="post" action="{{ action_url|default:request.path }}" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="alert alert-danger mb-3">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
    <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
        <div class="form-text small text-muted">{{ field.help_text }}</div>
        {% endif %}
        {% if field.errors %}
        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
        {% endif %}
    </div>
    {% endfor %}
    <div class="modal-footer px-0 pb-0 pt-3 border-top">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary rounded-pill px-4">Save</button>
    </div>
</form>
