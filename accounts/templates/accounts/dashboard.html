{% extends "accounts/base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="tab-content" id="accounts-dashboard-content">
                <div class="tab-pane fade show active" id="overview-tab" role="tabpanel" aria-labelledby="accounts-overview-link">
                    {% include "accounts/partials/_tab_users_overview.html" %}
                </div>
                {% for tab in account_dashboard_tabs %}
                <div class="tab-pane fade" id="{{ tab.id }}" role="tabpanel" aria-labelledby="{{ tab.id }}-link"
                     data-dashboard-fragment data-fragment-url="{% url 'accounts:dashboard' %}?tab={{ tab.key }}">
                    <div class="d-flex align-items-center gap-3 py-5 text-muted" role="status">
                        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                        <span>Open this section to load its data.</span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
    {{ block.super }}
    <script src="{% static 'accounts/js/dashboard-tabs.js' %}?v=20261030-lazy-tabs" defer></script>
{% endblock %}
