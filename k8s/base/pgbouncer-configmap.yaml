apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: database-pooler
data:
  pgbouncer.ini: |
    [databases]
    qaddb = host=postgres port=5432 dbname=qaddb user=postgres auth_user=postgres

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = plain
    auth_file = /etc/pgbouncer/userlist.txt
    
    # Session pooling matches Django ORM requirements
    pool_mode = session
    
    # Concurrency and pool sizing
    max_client_conn = 2000
    default_pool_size = 80
    min_pool_size = 15
    reserve_pool_size = 20
    reserve_pool_timeout = 5
    
    # Clean reset on session return
    server_reset_query = DISCARD ALL
    server_reset_query_always = 1
    
    # Connection timeouts
    server_idle_timeout = 300
    query_timeout = 600
    client_idle_timeout = 600
    server_connect_timeout = 15
    server_login_retry = 10
    
    # Diagnostics & Stats
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    stats_period = 60
    admin_users = postgres

