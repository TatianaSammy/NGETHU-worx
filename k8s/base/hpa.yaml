apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qad-celery-hpa
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: celery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qad-celery
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
