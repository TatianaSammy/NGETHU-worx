apiVersion: v1
kind: Service
metadata:
  name: qad-web
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-web
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: qad
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qad
        app.kubernetes.io/component: web
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: qad-serviceaccount
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: web
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: web
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-migrate
          image: qad-backend:stable
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for pgbouncer..."
              until nc -z pgbouncer 6432; do sleep 2; done
              echo "Waiting for redis..."
              until nc -z redis 6379; do sleep 2; done
              echo "Verifying Django migrations are applied..."
              python manage.py migrate --check || (echo "Migrations not complete, waiting..." && sleep 10 && python manage.py migrate --check)
              echo "Dependencies satisfied."
          envFrom:
            - configMapRef:
                name: qad-config
            - secretRef:
                name: qad-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: web
          image: qad-backend:stable
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - gunicorn
            - qad.wsgi:application
            - --bind=0.0.0.0:8000
            - --workers=4
            - --threads=4
            - --worker-class=gthread
            - --max-requests=5000
            - --max-requests-jitter=500
            - --timeout=180
            - --graceful-timeout=30
            - --keep-alive=10
            - --backlog=4096
            - --worker-tmp-dir=/dev/shm
            - --access-logfile=-
            - --error-logfile=-
            - --log-level=info
            - --forwarded-allow-ips=*
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: qad-config
            - secretRef:
                name: qad-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /app/tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: staticfiles
          persistentVolumeClaim:
            claimName: staticfiles-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

