apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qad-web-pdb
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qad
      app.kubernetes.io/component: web
