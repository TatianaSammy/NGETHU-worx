apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: database-pooler
spec:
  selector:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: database-pooler
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: database-pooler
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: qad
      app.kubernetes.io/component: database-pooler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qad
        app.kubernetes.io/component: database-pooler
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 6432
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: qad-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: qad-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qad-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: users
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: users
          secret:
            secretName: qad-pgbouncer-users
            items:
              - key: userlist.txt
                path: userlist.txt

