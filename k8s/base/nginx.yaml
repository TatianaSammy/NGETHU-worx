apiVersion: v1
kind: Service
metadata:
  name: qad-nginx
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: nginx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-nginx
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: nginx
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: qad
      app.kubernetes.io/component: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qad
        app.kubernetes.io/component: nginx
    spec:
      serviceAccountName: qad-serviceaccount
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: nginx
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: nginx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: qad-nginx:stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5; nginx -s quit"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/nginx.template
              subPath: nginx.template
            - name: staticfiles
              mountPath: /staticfiles
              readOnly: true
            - name: media
              mountPath: /media
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-conf
          configMap:
            name: qad-nginx-config
        - name: staticfiles
          persistentVolumeClaim:
            claimName: staticfiles-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: nginx-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 10Mi

