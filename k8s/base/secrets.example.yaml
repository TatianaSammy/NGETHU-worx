# ============================================================
# QAD Kubernetes Secrets — EXAMPLE FILE
# ============================================================
# 1. Copy this file:  cp secrets.example.yaml secrets.yaml
# 2. Fill in REAL values in secrets.yaml
# 3. Apply:           kubectl apply -f k8s/base/secrets.yaml
#
# NEVER commit secrets.yaml to version control.
# Add "k8s/base/secrets.yaml" to .gitignore
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: qad-secrets
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Django secret key — generate with: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  SECRET_KEY: "CHANGE_ME_generate_a_real_50char_secret_key_here"

  # Postgres
  POSTGRES_PASSWORD: "CHANGE_ME_strong_db_password"

  # Full DSNs (must match postgres.yaml + pgbouncer config)
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_strong_db_password@pgbouncer:6432/qaddb"
  REDIS_URL: "redis://redis:6379/0"

  # Celery broker & result backend
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"

  # Exchange EWS NTLM account (keep real values in the ignored secrets.yaml)
  EXCHANGE_USERNAME: ""
  EXCHANGE_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: qad-pgbouncer-users
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: pgbouncer
type: Opaque
stringData:
  # PgBouncer userlist.txt format: "username" "md5<md5(password+username)>"
  # Generate MD5 hash: echo -n "passwordusername" | md5sum  → prefix result with "md5"
  userlist.txt: |
    "postgres" "md5CHANGE_ME_md5_hash_of_password_concatenated_with_username"

