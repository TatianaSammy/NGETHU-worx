apiVersion: v1
kind: Service
metadata:
  name: qad-daphne
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: daphne
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: daphne
  ports:
    - name: ws
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qad-daphne
  namespace: qad
  labels:
    app.kubernetes.io/name: qad
    app.kubernetes.io/component: daphne
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: qad
      app.kubernetes.io/component: daphne
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qad
        app.kubernetes.io/component: daphne
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: qad-serviceaccount
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: daphne
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: daphne
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-deps
          image: qad-backend:stable
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z pgbouncer 6432; do echo "waiting for pgbouncer..."; sleep 2; done
              until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done
              echo "All dependencies ready."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: daphne
          image: qad-backend:stable
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - daphne
            - -b
            - "0.0.0.0"
            - -p
            - "8001"
            - --proxy-headers
            - --access-log
            - "-"
            - --ping-interval
            - "20"
            - --ping-timeout
            - "30"
            - --websocket_timeout
            - "86400"
            - qad.asgi:application
          ports:
            - name: ws
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: qad-config
            - secretRef:
                name: qad-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /app/tmp
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

