apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qad

resources:
  - ../../base

# Patch replicas to 1 for all workloads (resource-light for local dev)
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: qad-web
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: qad-daphne
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: qad-celery
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: qad-nginx
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: pgbouncer
  - patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints
        value: []
    target:
      kind: Deployment
      name: qad-nginx

  # Relax resource limits for local development
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
    target:
      kind: Deployment
      name: qad-web
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    target:
      kind: Deployment
      name: qad-daphne
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
    target:
      kind: Deployment
      name: qad-celery

  # Local PVC patches: use ReadWriteOnce and smaller sizes for local hostpath storage
  - patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteOnce
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
    target:
      kind: PersistentVolumeClaim
      name: media-pvc
  - patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteOnce
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
    target:
      kind: PersistentVolumeClaim
      name: staticfiles-pvc
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
    target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
    target:
      kind: PersistentVolumeClaim
      name: redis-pvc

  # Patch ingress for local development (remove host restriction so localhost and 127.0.0.1 work out of the box)
  - patch: |-
      - op: remove
        path: /spec/rules/0/host
      - op: remove
        path: /spec/tls
    target:
      kind: Ingress
      name: qad-ingress

  # Use localhost-friendly allowed hosts
  - patch: |-
      - op: replace
        path: /data/ALLOWED_HOSTS
        value: "*"
      - op: replace
        path: /data/ENVIRONMENT
        value: "development"
      - op: replace
        path: /data/CSRF_COOKIE_SECURE
        value: "False"
      - op: replace
        path: /data/SESSION_COOKIE_SECURE
        value: "False"
      - op: replace
        path: /data/CSRF_TRUSTED_ORIGINS
        value: "http://localhost,http://localhost:8000,http://qad.local,http://127.0.0.1,http://127.0.0.1:8000,https://localhost,https://qad.local,http://localhost:8080,http://127.0.0.1:8080"
      - op: replace
        path: /data/PUBLIC_ORIGIN
        value: "http://localhost:8000"
    target:
      kind: ConfigMap
      name: qad-config

  # Remove strict topology spread constraints that block scheduling on a small local cluster
  - patch: |-
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
    target:
      kind: Deployment
      name: qad-web
  - patch: |-
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
    target:
      kind: Deployment
      name: qad-daphne

  # Relax HPA min replicas for local
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler

  # Relax PDB for local (1 replica can't satisfy minAvailable: 2)
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
    target:
      kind: PodDisruptionBudget
      name: qad-web-pdb

# Image overrides for local — use locally built tags with imagePullPolicy: IfNotPresent
images:
  - name: qad-backend:stable
    newName: qad-backend
    newTag: latest
  - name: qad-nginx:stable
    newName: qad-nginx
    newTag: stable
