<header class="inventory-appbar">
    <div class="inventory-appbar__left">
        <button class="inventory-sidebar-toggle" type="button" id="sidebarToggle" aria-label="Toggle application navigation" title="Toggle navigation">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <span class="inventory-appbar__mark"><i class="fas fa-boxes-stacked" aria-hidden="true"></i></span>
        <div class="inventory-appbar__brand">
            <strong>NCWSCwaterLAB</strong>
            <span>Inventory operations</span>
        </div>
    </div>
    <div class="inventory-appbar__right">
        <span class="inventory-appbar__module"><i class="fas fa-layer-group" aria-hidden="true"></i> Stock intelligence</span>
        <span class="inventory-appbar__user"><span class="inventory-appbar__avatar">{{ request.user.first_name|default:request.user.username|slice:":1"|upper }}</span><span>{{ request.user.get_full_name|default:request.user.username }}</span></span>
        <a href="{% url 'logout' %}" class="inventory-appbar__logout"><i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i><span>Sign out</span></a>
    </div>
</header>
